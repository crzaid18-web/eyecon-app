const DEF_GUIDES=[
 {id:'g_bluecut',kind:'note',title:'عدسات Blue Cut',titleEn:'Blue Cut lenses',body:'تحجب جزءاً من الضوء الأزرق الصادر من الشاشات وتقلل الوهج، فتريح العين أثناء استخدام الهاتف والحاسوب. نظّفها بالبخاخ وقطعة المايكروفايبر فقط، وتجنب المناديل الورقية والماء الحار.',bodyEn:'They filter part of the blue light from screens and reduce glare, keeping your eyes comfortable on phones and computers. Clean them only with lens spray and a microfibre cloth; avoid tissues and hot water.'},
 {id:'g_photo',kind:'note',title:'العدسات المتغيرة مع الشمس (Photochromic)',titleEn:'Photochromic lenses',body:'تغمق تلقائياً تحت أشعة الشمس وتعود شفافة في الداخل خلال دقائق، وتحمي من الأشعة فوق البنفسجية. يقل تغميقها داخل السيارة لأن الزجاج يحجب الأشعة، وهذا طبيعي.',bodyEn:'They darken automatically in sunlight and clear indoors within minutes, with full UV protection. They darken less inside a car because the windscreen blocks UV; this is normal.'},
 {id:'g_pal',kind:'note',title:'العدسات التقدمية (Progressive)',titleEn:'Progressive lenses',body:'رؤية واضحة للبعيد والمتوسط والقريب في عدسة واحدة. انظر للبعيد من أعلى العدسة وللقراءة من أسفلها مع تحريك الرأس لا العين فقط، والتعوّد عليها يحتاج من أسبوع إلى أسبوعين.',bodyEn:'Clear distance, intermediate and near vision in one lens. Look through the top for distance and the bottom for reading, turning your head rather than only your eyes; allow one to two weeks to adapt.'},
 {id:'g_care',kind:'note',title:'العناية بالنظارة',titleEn:'Caring for your glasses',body:'البسها واخلعها بكلتا اليدين، وضعها في علبتها وعدساتها للأعلى. لا تتركها في السيارة أو تحت الشمس الحارة، ونظّفها يومياً بالبخاخ وقطعة المايكروفايبر.',bodyEn:'Put them on and take them off with both hands and keep them in their case, lenses up. Do not leave them in a hot car or in the sun, and clean them daily with lens spray and a microfibre cloth.'},
 {id:'g_cl',kind:'note',title:'العدسات اللاصقة',titleEn:'Contact lenses',body:'اغسل يديك قبل لمس العدسات، واستبدلها حسب المدة المحددة، ولا تنم بها أو تسبح بها. اخلعها وراجعنا فوراً عند الاحمرار أو الألم أو تشوش الرؤية.',bodyEn:'Wash your hands before handling lenses, replace them on schedule, and never sleep or swim in them. Remove them and see us at once if you have redness, pain or blurred vision.'},
 {id:'g_dry',kind:'flyer',title:'جفاف العين: نصائح للراحة',titleEn:'Dry eye: tips for comfort',body:'جفاف العين شائع مع الشاشات والمكيفات والغبار، ويظهر كحرقة أو شعور بوجود رمل في العين أو احمرار أو تشوش يتحسن بالرمش.\n• ارمش بوعي وبشكل كامل، خاصة أثناء القراءة واستخدام الشاشات.\n• استخدم القطرات المرطبة الخالية من المواد الحافظة حسب إرشاد الطبيب.\n• ضع كمادات دافئة على الجفون 5 دقائق يومياً ونظّف حافة الجفن بلطف.\n• اشرب كمية كافية من الماء، وأكثر من الأسماك والمكسرات الغنية بأوميغا 3.\n• أبعد هواء المكيف والمروحة عن وجهك، واستخدم جهاز ترطيب في الغرفة.\n• ارتدِ نظارة شمسية في الخارج للحماية من الرياح والغبار.\nراجعنا إذا استمرت الأعراض، أو ترافقت مع ألم شديد أو ضعف مفاجئ في النظر.',bodyEn:'Dry eye is common with screens, air conditioning and dust. It feels like burning, grittiness, redness or blur that clears when you blink.\n• Blink fully and on purpose, especially when reading or using screens.\n• Use preservative-free lubricating drops as advised.\n• Apply a warm compress to the lids for 5 minutes a day and gently clean the lid margins.\n• Drink enough water and eat fish and nuts rich in omega-3.\n• Keep air-conditioner and fan airflow away from your face; use a humidifier.\n• Wear sunglasses outdoors against wind and dust.\nSee us if symptoms persist or come with severe pain or sudden loss of vision.'},
 {id:'g_digital',kind:'flyer',title:'الإجهاد الرقمي وصحة النظر',titleEn:'Digital eye strain',body:'الإجهاد الرقمي هو تعب العين الناتج عن النظر الطويل إلى الشاشات، ويسبب صداعاً وحرقة وتشوشاً وألماً في الرقبة والكتفين.\n• قاعدة 20-20-20: كل 20 دقيقة انظر إلى شيء يبعد 6 أمتار لمدة 20 ثانية.\n• اجعل الشاشة أسفل مستوى العين قليلاً وعلى بُعد ذراع (50–70 سم).\n• اضبط سطوع الشاشة ليناسب إضاءة الغرفة، وكبّر الخط بدل الاقتراب من الشاشة.\n• استخدم نظارتك بالدرجة الصحيحة؛ العدسات المضادة للانعكاس وBlue Cut تقلل الوهج.\n• قلّل الشاشات قبل النوم بساعة لنوم أفضل.\n• افحص نظرك مرة كل سنة على الأقل.',bodyEn:'Digital eye strain is eye fatigue from long screen use. It causes headaches, burning, blur and neck and shoulder pain.\n• 20-20-20 rule: every 20 minutes look at something 6 metres away for 20 seconds.\n• Keep the screen slightly below eye level, an arm’s length away (50–70 cm).\n• Match screen brightness to the room and enlarge text instead of leaning in.\n• Wear glasses with the correct prescription; anti-reflective and Blue Cut lenses reduce glare.\n• Cut screen time in the hour before bed.\n• Have your eyes checked at least once a year.'},
 {id:'g_myopia',kind:'flyer',title:'قصر النظر عند الأطفال: ما يجب أن يعرفه الأهل',titleEn:'Myopia in children: what parents should know',body:'قصر النظر (Myopia) يعني أن الطفل يرى القريب بوضوح والبعيد مشوشاً، لأن العين أطول من الطبيعي فتتكوّن الصورة أمام الشبكية بدل أن تقع عليها.\nلماذا تزداد الدرجة؟ تنمو عين الطفل مع عمره، وكلما استطالت زادت الدرجة. يسرّع ذلك العمل القريب الطويل (الهاتف والأجهزة اللوحية والقراءة القريبة)، وقلة الوقت في الهواء الطلق، ووجود قصر نظر عند أحد الوالدين.\nلماذا هو خطير؟ الدرجات العالية تزيد في الكبر خطر انفصال الشبكية والماء الأزرق (الجلوكوما) والماء الأبيض المبكر وتغيرات الشبكية التي قد تُضعف النظر بشكل دائم.\nكيف نحمي عين الطفل؟\n• ساعتان يومياً على الأقل من اللعب في الهواء الطلق وضوء النهار.\n• تحديد وقت الشاشات واتباع قاعدة 20-20-20، وإبقاء الكتاب والجهاز على بُعد 30–40 سم.\n• لبس النظارة بالدرجة الصحيحة طوال الوقت حسب إرشاد الفاحص.\n• عدسات التحكم بقصر النظر وقطرات الأتروبين المخففة تبطئ زيادة الدرجة؛ اسألنا عن الأنسب لطفلك.\n• فحص النظر كل 6 أشهر لمتابعة تغيّر الدرجة.\nعلامات تستدعي الفحص: الاقتراب من التلفاز، تضييق العينين، فرك العينين، الصداع، أو تراجع المستوى الدراسي.',bodyEn:'Myopia (short-sightedness) means a child sees near objects clearly but distant ones blurred, because the eye is longer than normal and the image falls in front of the retina.\nWhy does it increase? A child’s eye grows with age, and the longer it grows the higher the prescription. Long near work (phones, tablets, close reading), little time outdoors and myopic parents speed this up.\nWhy does it matter? High myopia raises the adult risk of retinal detachment, glaucoma, early cataract and retinal changes that can permanently reduce vision.\nHow to protect your child’s eyes\n• At least two hours a day of outdoor play in daylight.\n• Limit screen time, follow the 20-20-20 rule and keep books and devices 30–40 cm away.\n• Wear glasses with the correct prescription full time as advised.\n• Myopia-control lenses and low-dose atropine drops slow progression; ask us what suits your child.\n• Eye checks every 6 months to track changes.\nSigns to get checked: sitting close to the TV, squinting, eye rubbing, headaches or falling school performance.'}];

function fmtRx(e){if(!e)return '—';const s=rxNum(e.sph),c=rxNum(e.cyl),a=e.axis!==''&&e.axis!=null?'×'+e.axis:'';if(!s&&!c)return '—';return (s||'Plano')+(c?' / '+c+' '+a:'')}

function normPhone(raw){let d=String(raw||'').replace(/\D/g,'');if(!d)return '';if(d.startsWith('00'))d=d.slice(2);if(d.startsWith('0')&&d.length===11)d='964'+d.slice(1);else if(d.length===10&&d.startsWith('7'))d='964'+d;return d}
function phoneOk(raw){const r=String(raw||'').replace(/\D/g,'');if(r.startsWith('0')&&!r.startsWith('00')&&r.length!==11)return false;const d=normPhone(raw);if(!d)return true;if(d.startsWith('964'))return /^9647\d{9}$/.test(d);return d.length>=8&&d.length<=15}
function waLink(phone,text){return 'https://wa.me/'+normPhone(phone)+(text?'?text='+encodeURIComponent(text):'')}

function errMsg(e){const c=e&&e.code;if(c==='invalid_argument')return t('errPerm');if(c==='quota_exceeded')return t('errQuota');if(c==='resource_exhausted')return t('errRate');return t('errNet')}
async function put(col,id,data){if(!db){toast(t('noDb'));return null}
  try{const ref=id?db.collection(col).doc(id):db.collection(col).doc();const prev=id?byId(col,id):null;
    const body={...(prev||{}),...data,updatedAt:Date.now()};delete body.id;if(!prev)body.createdAt=Date.now();
    await ref.set(body);return ref.id}catch(e){toast(errMsg(e));if(e&&e.code==='invalid_argument'){canWrite=false;schedule()}return null}}
async function del(col,id){try{await db.collection(col).doc(id).delete();return true}catch(e){toast(errMsg(e));return false}}
async function adjustStock(itemId,delta,extra){const it=byId('items',itemId);if(!it)return;
  try{await db.doc('items/'+itemId).update({qty:num(it.qty)+delta,...(extra||{}),updatedAt:Date.now()});it.qty=num(it.qty)+delta}catch(e){toast(errMsg(e))}}
const maxCode=()=>S.patients.reduce((m,p)=>Math.max(m,parseInt(String(p.code||'').replace(/\D/g,''))||0),0);
async function allocCode(){const fmtC=n=>'EG-'+String(n).padStart(5,'0');
  if(db&&db.__incr){try{return fmtC(await db.__incr('counters/patients',maxCode()+1))}catch(_){}}
  try{const ref=db.doc('counters/patients');
    for(let i=0;i<6;i++){const r=await ref.acquire({holder,ttlMs:4000});
      if(r.acquired){const s=await ref.get();const n=Math.max(num(s.exists&&s.data().n),maxCode())+1;await ref.set({n,updatedAt:Date.now()});return fmtC(n)}
      await sleep(350+Math.random()*300)}}catch(_){}
  return fmtC(maxCode()+1)}

function openModal(title,bodyHTML,{onSubmit,submitLabel=t('save'),extraFooter='',wide=false,onMount}={}){

/* ================= periods & accounting ================= */
function periodRange(key,from,to){const d=new Date(),y=d.getFullYear(),m=d.getMonth();
  if(key==='today')return[today(),today()];if(key==='month')return[iso(new Date(y,m,1)),iso(new Date(y,m+1,0))];if(key==='last')return[iso(new Date(y,m-1,1)),iso(new Date(y,m,0))];
  if(key==='year')return[y+'-01-01',y+'-12-31'];if(key==='custom')return[from||'0000-01-01',to||'9999-12-31'];return['0000-01-01','9999-12-31']}
const inR=(d,[a,b])=>(d||'')>=a&&(d||'')<=b;
const PERIODS=['today','month','last','year','all','custom'];
const periodSeg=(key,stateKey)=>`<div class="seg" role="group" aria-label="${t('period')}">${PERIODS.map(k=>`<button type="button" data-period="${k}" data-pkey="${stateKey}" aria-pressed="${key===k}">${t('p_'+k)}</button>`).join('')}</div>`;
const customRange=()=>`<div class="fr" style="max-width:420px">${fi(t('from'),'pfrom',UI.from,'date','data-range="from"')}${fi(t('to'),'pto',UI.to,'date','data-range="to"')}</div>`;
const saleIQD=s=>toIQD(s.total,s.currency,s.rate),salePaidIQD=s=>toIQD(s.paid,s.currency,s.rate);
const saleCOGS=s=>(s.lines||[]).reduce((a,l)=>a+num(l.costIQD)*num(l.qty),0);
function computeAcc(range,filt){const f=filt||inBranch;
  const sales=S.sales.filter(s=>f(s)&&inR(s.date,range));
  const revenue=sales.reduce((a,s)=>a+saleIQD(s),0),cogs=sales.reduce((a,s)=>a+saleCOGS(s),0),collected=sales.reduce((a,s)=>a+salePaidIQD(s),0);
  const expenses=S.expenses.filter(e=>f(e)&&inR(e.date,range)).reduce((a,e)=>a+toIQD(e.amount,e.currency,e.rate),0);
  const purchases=S.purchases.filter(p=>f(p)&&inR(p.date,range)).reduce((a,p)=>a+toIQD(p.total,p.currency,p.rate),0);
  const discounts=sales.reduce((a,s)=>a+toIQD(s.discount,s.currency,s.rate),0);
  const gross=revenue-cogs;return{sales,revenue,discounts,cogs,collected,expenses,purchases,gross,net:gross-expenses,count:sales.length}}
const receivables=()=>S.sales.filter(inBranch).reduce((a,s)=>a+Math.max(0,saleIQD(s)-salePaidIQD(s)),0);
const stockValue=()=>S.items.filter(inBranch).reduce((a,i)=>a+Math.max(0,num(i.qty))*toIQD(i.cost,i.currency,rate()),0);
const lowStock=()=>S.items.filter(i=>inBranch(i)&&i.minQty!==''&&i.minQty!=null&&num(i.qty)<=num(i.minQty));
function expiring(){const l=new Date();l.setDate(l.getDate()+60);const L=iso(l);return S.items.filter(i=>inBranch(i)&&i.type==='contact'&&i.expiry&&i.expiry<=L&&num(i.qty)>0)}
const followUps=()=>S.exams.filter(e=>inBranch(e)&&e.followUp&&!e.followDone).sort((a,b)=>a.followUp.localeCompare(b.followUp));
const openOrders=()=>S.sales.filter(s=>inBranch(s)&&['preparing','ready','shipped','postponed'].includes(s.status)).sort((a,b)=>(a.dueDate||'9').localeCompare(b.dueDate||'9'));
const statusChip=s=>{const st=s.status||'none';if(st==='none')return '';const cls={preparing:'acc',ready:'good',shipped:'good',postponed:'warn',delivered:''}[st];return `<span class="chip ${cls}">${t('st_'+st)}${st==='preparing'&&s.stage?' · '+t(s.stage):''}</span>`};

  const lastSale={};S.sales.forEach(x=>{if(x.patientId&&(!lastSale[x.patientId]||sortDate(x,lastSale[x.patientId])<0))lastSale[x.patientId]=x});

  ${list.map(p=>{const e=last[p.id],ls=lastSale[p.id];return `<tr class="click" data-act="openPatient" data-id="${p.id}"><td class="n">${esc(p.code||'—')}</td><td>${esc(p.name)}</td><td class="n">${patientAge(p)}</td><td class="n">${esc(p.phone||'')}${p.phone&&p.waVerified?' <span class="chip wa">WA ✓</span>':''}</td><td class="n">${e?e.date:'—'}</td><td>${vaMini(e)}</td><td>${e&&e.rx&&hasEye(e.rx,['sph','cyl'])?`<span class="rx od">${fmtRx(e.rx.od)}</span><br><span class="rx os">${fmtRx(e.rx.os)}</span>${hasEye(e.rx,['add'])?`<br><span class="rx muted">ADD ${rxNum((e.rx.od||{}).add)||'—'}/${rxNum((e.rx.os||{}).add)||'—'}</span>`:''}`:'<span class="muted">—</span>'}</td><td style="min-width:170px">${ls?saleMini(ls):'<span class="muted">—</span>'}</td></tr>`}).join('')}
  </tbody></table></div>`:`<div class="panel">${emptyBox(loading('patients')?t('loading'):(q?t('noResults'):t('noPatients')),q?'':`<button class="btn primary" data-act="newPatient">${t('firstPatient')}</button>`)}</div>`}`}

function vaMini(e){const v=(e&&e.va)||{},u=v.ucva||{},b=v.bcva||{};if(!(u.od||u.os||b.od||b.os))return '<span class="muted">—</span>';

function saleMini(s){const ls=s.lines||[],fr=ls.filter(l=>l.type==='frame').map(l=>esc(l.name)),le=ls.filter(l=>isRx(l.type)).map(l=>esc(l.name));

function vaLine(va){if(!va)return '';const u=va.ucva||{},b=va.bcva||{},n=va.near||{},ph=va.ph||{};const out=[];
  const pr=(o,ou)=>`<span class="rx"><span class="od">R ${esc(o.od||'—')}</span> · <span class="os">L ${esc(o.os||'—')}</span>${ou&&o.ou?' · OU '+esc(o.ou):''}</span>`;

const hasEye=(o,keys)=>!!o&&['od','os'].some(k=>o[k]&&keys.some(x=>o[k][x]!==''&&o[k][x]!=null));

    ${e.complaint?`<div><span class="muted">${t('complaintL')}: </span>${esc(e.complaint)}</div>`:''}
    <div class="grid2" style="gap:12px">
      ${vaLine(e.va)?`<div class="rxcard"><span class="muted" style="font-size:.8rem">${t('vaShort')}</span><div>${vaLine(e.va)}</div></div>`:''}

function vInventory(){

  const counts={};base.forEach(i=>counts[i.type]=(counts[i.type]||0)+num(i.qty));
  const lows=new Set(lowStock().map(i=>i.id)),exps=new Set(expiring().map(i=>i.id));const bc=branchCol();const nc=bc?8:7;
  const grpQty={};list.forEach(i=>{if(isRx(i.type)){const g=i.type+'|'+(i.brand||'');grpQty[g]=(grpQty[g]||0)+num(i.qty)}});

const BOXES=['cash','pos_switch','pos_qi','qi_transfer'];

const payCur=(x,d)=>x.cur||d.currency||'IQD',payVal=x=>x.val!=null?num(x.val):num(x.amount);
const convCur=(a,from,to,r)=>from===to?num(a):(to==='IQD'?num(a)*(num(r)||rate()):num(a)/(num(r)||rate()));
const curOpts=()=>[['IQD',t('iqd')],['USD',t('usd')]];
const payBox=()=>`<div class="list" id="payList"></div><div class="fr"><label class="f"><span>${t('payAmt')}</span><input id="np_amt" type="number" step="any" inputmode="decimal"></label><label class="f"><span>${t('date')}</span><input id="np_date" type="date" value="${today()}"></label><label class="f"><span>${t('payCur')}</span><select id="np_cur">${curOpts().map(([k,l])=>`<option value="${k}">${l}</option>`).join('')}</select></label><label class="f"><span>${t('box')}</span><select id="np_method">${boxOpts().map(([k,l])=>`<option value="${k}">${l}</option>`).join('')}</select></label><div style="align-self:end"><button type="button" class="btn" id="np_add">${t('addPay')}</button></div></div>`;
function wirePays(f,pays,cur,tot,onChange){const T=()=>typeof tot==='function'?tot():tot;
  const box=f.querySelector('#payList'),amt=f.querySelector('#np_amt'),pc=f.querySelector('#np_cur');pc.value=cur;const sum=()=>pays.reduce((a,x)=>a+payVal(x),0);
  const draw=()=>{box.innerHTML=pays.length?pays.map((x,i)=>`<div class="row"><span><span class="ltr">${esc(x.date)}</span> · ${boxName(x.method)}</span><span class="seg"><b class="rx">${fmt(x.amount,x.cur||cur)}</b>${(x.cur||cur)!==cur?`<span class="rx muted">≈ ${fmt(payVal(x),cur)}</span>`:''}<button type="button" class="btn ghost danger sm" data-pi="${i}" aria-label="${t('del')}">✕</button></span></div>`).join(''):`<p class="note">${t('noPays')}</p>`;onChange(sum())};
  box.addEventListener('click',e=>{const b=e.target.closest('[data-pi]');if(b){pays.splice(+b.dataset.pi,1);draw()}});
  const add=()=>{const a=num(amt.value);if(!a)return true;const c=pc.value,v=+convCur(a,c,cur,rate()).toFixed(cur==='USD'?2:0);if(v>T()-sum()+(cur==='USD'?0.01:1)){toast(t('overpay'));return false}pays.push({date:f.querySelector('#np_date').value||today(),amount:a,cur:c,rate:rate(),val:Math.min(v,+(T()-sum()).toFixed(2)),method:f.querySelector('#np_method').value});amt.value='';draw();return true};
  f.querySelector('#np_add').onclick=add;amt.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();add()}});
  draw();return{add,sum,fill:()=>{pc.value=cur;amt.value=+Math.max(0,T()-sum()).toFixed(cur==='USD'?2:0);amt.focus()}}}

  const it=e.target.closest('[data-invtype]');if(it){UI.invType=it.dataset.invtype;render();return}
  if(e.target.id==='resetTpl'){const f=$('#setForm');MSG_TYPES.forEach(k=>['ar','en'].forEach((l,i)=>{const el=f.querySelector(`[name="tpl.${k}.${l}"]`);if(el)el.value=TPL_DEFAULT[k][i]}));return}
  const a=e.target.closest('[data-act]');if(!a)return;e.preventDefault();
  const id=a.dataset.id,act=a.dataset.act;const need=()=>{if(!canWrite){toast(t('viewOnlyToast'));return false}return true};
  switch(act){
    case 'newExam':if(need())examForm({},a.dataset.pid||UI.patientId);break;case 'editExam':examForm(byId('exams',id));break;
    case 'newPatient':if(need())patientForm();break;case 'editPatient':patientForm(byId('patients',id));break;
    case 'openPatient':UI.patientId=id;view='patients';render();window.scrollTo(0,0);break;case 'backPatients':UI.patientId=null;render();break;
    case 'orderUpd':orderForm(byId('sales',id));break;
    case 'waPatient':waForm(id,a.dataset.type,{exam:a.dataset.exam,sale:a.dataset.sale});break;
    case 'newItem':if(need())itemForm();break;case 'editItem':itemForm(byId('items',id));break;
    case 'newSale':if(need())saleForm({},a.dataset.pid||'');break;case 'editSale':saleForm(byId('sales',id));break;
    case 'newPurchase':if(need())purchaseForm();break;case 'editPurchase':purchaseForm(byId('purchases',id));break;
    case 'newExpense':if(need())expenseForm();break;case 'editExpense':expenseForm(byId('expenses',id));break;case 'editCat':catForm(id);break;
    case 'newPartner':if(need())partnerForm({},a.dataset.scope);break;case 'editPartner':partnerForm(byId('partners',id));break;
    case 'newWithdrawal':if(need())withdrawalForm();break;case 'editWithdrawal':withdrawalForm(byId('withdrawals',id));break;
    case 'newCampaign':if(need())campaignForm();break;case 'editCampaign':campaignForm(byId('campaigns',id));break;case 'pickCamp':UI.campId=id;render();break;
    case 'newBranch':if(need())branchForm();break;case 'editBranch':branchForm(id);break;case 'pickBranch':setBranch(id);break;
    case 'copyRx':{const txt=rxText(byId('exams',id));navigator.clipboard.writeText(txt).then(()=>toast(t('copied'))).catch(()=>openModal(t('rxText'),`<textarea id="rxTxt" style="min-height:220px">${esc(txt)}</textarea>`,{onMount:f=>f.querySelector('#rxTxt').select()}));break}
    case 'backup':doBackup();break;case 'gasUsers':gasUsersForm();break;case 'gasPass':gasPassForm();break;case 'gasLogout':window.__gas&&window.__gas.logout();break;case 'sheets':doSheets();break;
    case 'printRx':printExam(byId('exams',id),a.dataset.kind||'exam');break;
    case 'newVoucher':voucherForm();break;case 'printVoucher':printVoucher(byId('vouchers',id));break;
    case 'delVoucher':if(need())armDelete(a,()=>delVoucher(byId('vouchers',id)));break;
    case 'newExchange':if(need())exchangeForm();break;case 'editExchange':exchangeForm(byId('exchanges',id));break;
    case 'partnerSt':partnerSt(byId('partners',id));break;case 'askRate':rateForm();break;
    case 'newGuide':guideForm({kind:'note'});break;
    case 'editGuide':guideForm(guides().find(g=>g.id===id));break;
    case 'printGuide':{const g=guides().find(x=>x.id===id);if(g)printPreview(g.title,()=>printShell(gT(g),flyerPage(g,branch(defBranch())),branch(defBranch()),false),{fname:'guide-'+g.id});break}
    case 'addBrand':{const el=$('#newBrand'),v=(el&&el.value||'').trim();if(!v||!canWrite)break;if(partners().includes(v)){toast(t('specExists'));break}saveSettings({partners:[...partners(),v]});break}
    case 'delBrand':{if(!canWrite)break;saveSettings({partners:partners().filter(x=>x!==id)});const lg={...S.brandLogos};delete lg[id];if(db)db.doc('settings/brands').set({logos:lg,updatedAt:Date.now()}).catch(()=>{});break}
    case 'specAdd':{const k=a.dataset.l,el=$('#spec_'+k),v=(el&&el.value||'').trim();if(!v||!canWrite)break;const sp={...(S.settings.specs||{})},c={add:[...((sp[k]||{}).add||[])],hide:[...((sp[k]||{}).hide||[])]};
      const base=specBase(k).find(x=>tx(x)===v||x===v);if(base&&c.hide.includes(base)){c.hide=c.hide.filter(x=>x!==base)}else if(spec(k).some(x=>tx(x)===v)){toast(t('specExists'));break}else c.add.push(v);sp[k]=c;saveSettings({specs:sp});break}
    case 'specDel':{const k=a.dataset.l,v=id;if(!canWrite)break;const sp={...(S.settings.specs||{})},c={add:[...((sp[k]||{}).add||[])],hide:[...((sp[k]||{}).hide||[])]};
      if(c.add.includes(v))c.add=c.add.filter(x=>x!==v);else c.hide.push(v);sp[k]=c;saveSettings({specs:sp});break}
    case 'addCat':{const el=$('#newCat'),v=(el&&el.value||'').trim();if(!v||!isAdmin)break;if(expCats().some(k=>catLbl(k)===v)){toast(t('catExists'));break}saveSettings({expCats:[...(S.settings.expCats||[]),v]});break}
    case 'delCat':if(isAdmin)armDelete(a,()=>saveSettings({expCats:(S.settings.expCats||[]).filter(k=>k!==id)}));break;
    case 'newAsset':if(need())assetForm();break;case 'editAsset':assetForm(byId('fixedAssets',id));break;
    case 'delLogo':if(need()&&db)db.doc('settings/logo').delete().then(()=>{S.logo='';render()}).catch(err=>toast(errMsg(err)));break;
    case 'toggleUnpaid':UI.salesUnpaid=!UI.salesUnpaid;render();break;
    case 'openDebts':view='sales';UI.salesPeriod='all';UI.salesUnpaid=true;UI.patientId=null;render();window.scrollTo(0,0);break;
  }});
document.addEventListener('input',e=>{const m=['patQ','invQ','salesQ'].includes(e.target.id);if(m&&!e.target.closest('#modalRoot')){UI[e.target.id]=e.target.value;keepFocus(e.target.id)}});
async function saveSettings(patch){if(!db)return toast(t('noDb'));try{await db.doc('settings/main').set({...S.settings,...patch,updatedAt:Date.now()});Object.assign(S.settings,patch);render()}catch(err){toast(errMsg(err))}}
function rateForm(){if(!canWrite||!db)return;openModal(t('todayRate'),`<p class="note" style="font-size:.9rem">${t('rateAsk')}</p><div class="fr">${fi(t('rate'),'rate',rate(),'number','step="any" min="1"')}</div>`,
  {submitLabel:t('setRate'),onSubmit:async f=>{const r=num(formObj(f).rate);if(!r){toast(t('needAmt'));return false}try{await db.doc('settings/main').set({...S.settings,rate:r,rateDate:today(),updatedAt:Date.now()});await db.doc('rates/'+today()).set({rate:r,date:today(),updatedAt:Date.now()});Object.assign(S.settings,{rate:r,rateDate:today()});toast(t('rateSaved'))}catch(err){toast(errMsg(err));return false}}})}
function maybeAskRate(){if(rateAsked||!canWrite||!db||S.settings.rateDate===today())return;if($('#ov'))return setTimeout(maybeAskRate,4000);rateAsked=true;rateForm()}
async function setBrandLogo(name,file){if(!db||!file||!canWrite)return;const url=URL.createObjectURL(file);try{const img=new Image();await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src=url});
  const sc=Math.min(1,240/(img.naturalWidth||240),80/(img.naturalHeight||80)),c=document.createElement('canvas');c.width=Math.max(1,Math.round((img.naturalWidth||240)*sc));c.height=Math.max(1,Math.round((img.naturalHeight||80)*sc));c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  let data=c.toDataURL('image/webp',0.92);if(!data.startsWith('data:image/webp'))data=c.toDataURL('image/png');const logos={...S.brandLogos,[name]:data};await db.doc('settings/brands').set({logos,updatedAt:Date.now()});S.brandLogos=logos;toast(t('savedLogo'));render()}catch(err){toast(errMsg(err))}finally{URL.revokeObjectURL(url)}}
async function setLogo(file){if(!db||!file)return;const url=URL.createObjectURL(file);try{const img=new Image();await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src=url});
  const sc=Math.min(1,360/Math.max(img.naturalWidth||360,img.naturalHeight||360)),c=document.createElement('canvas');c.width=Math.round((img.naturalWidth||360)*sc);c.height=Math.round((img.naturalHeight||360)*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  let data=c.toDataURL('image/webp',0.92);if(!data.startsWith('data:image/webp'))data=c.toDataURL('image/png');await db.doc('settings/logo').set({data,updatedAt:Date.now()});S.logo=data;S.logoMark='';toast(t('savedLogo'));render()}catch(err){toast(errMsg(err))}finally{URL.revokeObjectURL(url)}}
document.addEventListener('change',e=>{if(e.target.id==='logoFile'){setLogo(e.target.files[0]);return}if(e.target.id==='gasImpFile'&&window.__gas){const fl=e.target.files[0];e.target.value='';if(fl)fl.text().then(x=>window.__gas.importBackup(x)).then(n=>toast(t('gasImported')+n)).catch(er=>toast(errMsg(er)));return}if(e.target.dataset&&e.target.dataset.brand){setBrandLogo(e.target.dataset.brand,e.target.files[0]);return}if(e.target.dataset&&e.target.dataset.range&&!e.target.closest('#modalRoot')){UI[e.target.dataset.range]=e.target.value;render()}});
function keepFocus(id){const el=$('#'+id),pos=el.selectionStart;render();const n=$('#'+id);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}}
document.addEventListener('submit',async e=>{if(e.target.id!=='setForm')return;e.preventDefault();if(!db){toast(t('noDb'));return}const o=formObj(e.target);o.rate=num(o.rate)||1310;
  try{await db.doc('settings/main').set({...S.settings,...o,updatedAt:Date.now()});Object.assign(S.settings,o);toast(t('savedSettings'))}catch(err){toast(errMsg(err))}});
const SHEET_NAMES={patients:['الزبائن','Customers'],exams:['الفحوصات','Exams'],sales:['المبيعات','Sales'],sale_lines:['مواد الفواتير','Invoice lines'],payments:['الدفعات','Payments'],items:['المخزون','Stock'],purchases:['المشتريات','Purchases'],purchase_lines:['مواد المشتريات','Purchase lines'],expenses:['المصاريف','Expenses'],vouchers:['سندات الصرف','Vouchers'],partners:['الشركاء','Partners'],withdrawals:['سحوبات الشركاء','Withdrawals'],fixedAssets:['الأصول','Fixed assets'],exchanges:['صرف العملة','Exchanges'],campaigns:['حملات واتساب','Campaigns'],branches:['الفروع','Branches'],guides:['النماذج التثقيفية','Guides']};
function flatRow(o,pre='',out={}){for(const [k,v] of Object.entries(o||{})){const key=pre?pre+'.'+k:k;if(v==null)out[key]='';else if(Array.isArray(v))out[key]=v.length&&typeof v[0]!=='object'?v.join(', '):(v.length?v.length+' ×':'');else if(typeof v==='object')flatRow(v,key,out);else if(typeof v==='string'&&v.startsWith('data:'))out[key]='[image]';else out[key]=typeof v==='string'&&v.length>32000?v.slice(0,32000):v}return out}
async function doSheets(){if(!downloads)return;toast(t('sheetsWork'));try{await lib('xlsx')}catch(_){toast(t('pdfFail'));return}
  const pn=id=>{const p=byId('patients',id);return p?(p.code?p.code+' · ':'')+(p.name||''):''},d8=x=>x?new Date(x).toISOString().slice(0,10):'';
  const base=r=>{const o=flatRow(r);delete o.createdAt;delete o.updatedAt;return {id:r.id,...o,created:d8(r.createdAt),updated:d8(r.updatedAt)}};
  const data={patients:S.patients.map(base),exams:S.exams.map(e=>({customer:pn(e.patientId),...base(e)})),
    sales:S.sales.map(x=>({customer:pn(x.patientId)||x.customer||'',...base(x)})),
    sale_lines:S.sales.flatMap(x=>(x.lines||[]).map(l=>({invoice:x.no,date:x.date,customer:pn(x.patientId)||x.customer||'',item:l.name,power:l.pow||'',type:tx('t_'+l.type),qty:l.qty,price:l.price,total:num(l.qty)*num(l.price),currency:x.currency,itemId:l.itemId||'',saleId:x.id}))),
    payments:S.sales.flatMap(x=>payList(x).map(y=>({invoice:x.no,customer:pn(x.patientId)||x.customer||'',date:y.date,amount:y.amount,currency:y.cur||x.currency,value:payVal(y),box:boxName(y.method),saleId:x.id}))),
    items:S.items.map(base),purchases:S.purchases.map(base),
    purchase_lines:S.purchases.flatMap(x=>(x.lines||[]).map(l=>({date:x.date,supplier:x.supplier,item:l.name,power:l.pow||'',qty:l.qty,cost:l.cost,currency:x.currency,purchaseId:x.id}))),
    expenses:S.expenses.map(e=>({category:catLbl(e.category||''),...base(e)}))};
  ['vouchers','partners','withdrawals','fixedAssets','exchanges','campaigns','branches','guides'].forEach(c=>{if((S[c]||[]).length)data[c]=S[c].map(base)});
  const wb=XLSX.utils.book_new();wb.Workbook={Views:[{RTL:lang==='ar'}]};
  for(const [k,rows] of Object.entries(data)){const ws=XLSX.utils.json_to_sheet(rows.length?rows:[{'—':''}]);XLSX.utils.book_append_sheet(wb,ws,(SHEET_NAMES[k]||[k,k])[lang==='ar'?0:1].slice(0,31))}
  const st=flatRow({...S.settings,specs:undefined,partners:undefined});XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(Object.entries(st).map(([k,v])=>({key:k,value:v}))),lang==='ar'?'الإعدادات':'Settings');
  const buf=XLSX.write(wb,{bookType:'xlsx',type:'array'});
  try{await downloads.save({filename:'eyecon-data-'+today()+'.xlsx',data:new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})})}catch(e){if(e&&e.code&&!['declined','cancelled','canceled'].includes(e.code))toast(t('dlFail'))}}
async function doBackup(){if(!downloads)return;const data={exportedAt:new Date().toISOString(),settings:S.settings,logo:S.logo,logoDoc:{data:S.logo||'',mark:S.logoMark||''},brandLogos:S.brandLogos||{}};COLS.forEach(c=>data[c]=S[c]);
  try{await downloads.save({filename:'eyecon-backup-'+today()+'.json',data:JSON.stringify(data,null,1)})}catch(e){if(e&&e.code&&!['declined','cancelled','canceled'].includes(e.code))toast(t('dlFail'))}}

/* ================= boot ================= */
render();
(async()=>{
  if(!window.claude||!window.claude.use){dbState='none';render();return}
  claude.use('downloads').then(d=>{downloads=d;if(view==='settings')schedule()}).catch(()=>{});
  try{db=await claude.use('db')}catch(_){db=null}
  if(!db){dbState='none';render();return}
  dbState='ok';
  try{const u=await claude.use('user');if(u){const c=await u.can('data.write');if(c===false)canWrite=false;try{isAdmin=!!(await u.canEdit())}catch(_){}}}catch(_){}
  COLS.forEach(c=>db.collection(c).onSnapshot(s=>{S[c]=s.docs.map(d=>({id:d.id,...d.data()}));loaded[c]=true;schedule()},err=>{loaded[c]=true;if(err&&err.code==='revoked')canWrite=false;schedule()}));
  db.doc('settings/brands').onSnapshot(s=>{S.brandLogos=s.exists?(s.data().logos||{}):{};schedule()},()=>{});
  db.doc('settings/logo').onSnapshot(s=>{S.logo=s.exists?(s.data().data||''):'';S.logoMark=s.exists?(s.data().mark||''):'';try{applyLang()}catch(_){}schedule()},()=>{});
  db.doc('settings/main').onSnapshot(s=>{if(s.exists)Object.assign(S.settings,s.data());setTimeout(maybeAskRate,300);const ae=document.activeElement;if(!(ae&&ae.closest&&ae.closest('#setForm')))schedule()},()=>{});
  render();
})();
</script>
